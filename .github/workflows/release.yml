# Publishes to PyPI when a version tag (e.g. v0.1.0) is pushed. Uses PyPI trusted publishing, so
# no token is stored: PyPI is told to trust this repository's `release.yml` in the `pypi`
# environment (see "Releasing" in the README).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the tag matches the version
        run: |
          version=$(python -c "import re; print(re.search(r\"__version__ = '(.+)'\", open('src/bbtui/__init__.py').read())[1])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ $version"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install -U pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bbtui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog, as the release notes.
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "bbtui $version" --notes-file notes.md
