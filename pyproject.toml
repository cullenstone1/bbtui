[project]
name = "bbtui"
dynamic = ["version"]
description = "A terminal UI for Bitbucket Cloud: pull requests, reviews and pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cullen Stone" }]
keywords = ["bitbucket", "tui", "textual", "pull-requests", "code-review", "pipelines"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings[yaml]>=2.10.0,<3.0.0",
    "textual>=8.0.0,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/cullenstone1/bbtui"
Issues = "https://github.com/cullenstone1/bbtui/issues"
Changelog = "https://github.com/cullenstone1/bbtui/blob/main/CHANGELOG.md"

[project.scripts]
bbtui = "bbtui.cli:main"

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
lint = [
    "ruff>=0.15.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bbtui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bbtui"]

[tool.hatch.build.targets.sdist]
include = ["src/bbtui", "tests", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "ruff.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
