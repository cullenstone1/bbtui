[project]
name = "bbtui"
version = "0.1.0"
description = "A terminal UI for Bitbucket Cloud: pull requests, reviews and pipelines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic-settings[yaml]>=2.10.0,<3.0.0",
    "textual>=8.0.0,<9.0.0",
]

[project.scripts]
bbtui = "bbtui.cli:main"

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
lint = [
    "ruff>=0.15.0",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbtui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
