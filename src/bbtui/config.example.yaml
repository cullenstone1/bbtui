# bbtui settings. `bbtui --init` writes this file for you; it lives at
# ~/.config/bbtui/config.yaml (or wherever BBTUI_CONFIG_FILE points).
# Any setting can also come from a BBTUI_<NAME> environment variable, e.g. BBTUI_API_TOKEN.

# Your Atlassian account email.
username: you@example.com

# A *scoped* Atlassian API token with Bitbucket scopes. Classic unscoped tokens (the kind Jira
# accepts) are rejected with "API Token provided has no Bitbucket scopes."
# Create one at https://id.atlassian.com/manage-profile/security/api-tokens
# ("Create API token with scopes", app: Bitbucket) with at least:
#   read:user:bitbucket, read:workspace:bitbucket, read:repository:bitbucket,
#   read:pullrequest:bitbucket, read:pipeline:bitbucket
# and, to approve, comment and merge, write:pullrequest:bitbucket
# and, to re-run and stop pipelines, write:pipeline:bitbucket
api_token: ATATT...

# The workspace bbtui opens in.
workspace: your-workspace

# Repositories pinned to the dashboard, as `repo_slug` or `workspace/repo_slug`.
# (Bitbucket has no public API for the stars in its web UI, so they live here.)
starred_repos: []
#  - some-repo
#  - another-workspace/other-repo

# How many recently updated repositories the dashboard shows.
recent_repos_limit: 10

# Whether draft pull requests show under "Waiting for my review" on the dashboard.
review_include_drafts: false

# Whether new pull requests close their source branch after merge, by default.
close_source_branch: false

# A Pygments style for syntax highlighting in diffs (e.g. monokai, dracula, github-dark,
# one-dark). By default one is picked to suit the app theme.
# syntax_theme: monokai

# A Textual theme, e.g. textual-dark, nord, gruvbox, tokyo-night.
theme: textual-dark

# Go back to the dashboard after this many minutes without a key press, click or scroll.
# It never does while you're writing a comment, have an unposted comment draft, or have edited a
# new pull request's title or description. 0 (the default) turns it off.
# idle_timeout_minutes: 15
